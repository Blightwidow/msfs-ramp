# MSFS Airport Preloader configuration
# Lines starting with # or ; are comments. Delete a line to use its default.

# Start warming an airport's files once the aircraft is this close (nautical miles).
# Must be larger than MSFS's own ~25 NM load radius so files are hot in time.
OuterRadiusNauticalMiles = 60

# How often to re-check aircraft position (seconds).
PollSeconds = 2

# Soft cap on how many MB we pull into the OS cache per session.
# Keep below (free RAM - what MSFS needs) so we don't evict useful pages.
RamBudgetMegabytes = 4096

# Optional: force the MSFS package folder (the one containing Community\ and Official\).
# Leave blank to auto-detect from UserCfg.opt.
# InstalledPackagesPath = D:\MSFS\Packages

# Optional: path to the OurAirports airports.csv. Blank = airports.csv beside the exe.
# AirportsCsvPath = D:\data\airports.csv

Verbose = true
