# MSFS Airport Preloader configuration
# Managed by the app's Settings panel; hand-edits are preserved on next save.

# Distance (NM) at which warming starts. Keep larger than MSFS's ~25 NM load radius.
OuterRadiusNauticalMiles = 60

# Position re-check interval (seconds).
PollSeconds = 2

# Max MB held in page cache at once (freed as airports leave range).
RamBudgetMegabytes = 4096

# MSFS package folder (contains Community\ and Official\). Blank = auto-detect.
InstalledPackagesPath =

# OurAirports airports.csv path. Blank = airports.csv beside the exe.
AirportsCsvPath =

StartWithWindows = false
Verbose = true
